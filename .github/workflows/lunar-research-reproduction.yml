name: Independent lunar research reproduction
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/lunar-research-reproduction.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/lunar-research-reproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and package regressions
        run: |
          npm run check
          npm test
      - name: Reproduce independent 365-day USNO reference comparison
        run: |
          node src/lunar-reference-assay.mjs test/fixtures/usno-2026-noon-utc-illumination.csv test/fixtures/usno-2026-noon-utc-original-rendered-table.txt > lunar-reference-reproduction.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("lunar-reference-reproduction.json", "utf8"));
            if (r.reference_days !== 365 || r.reference.sha256 !== "b8e64f318ad14db40d5d95cf8260d78d3e52f78e4ba3e8cb5efde6991e0d2eff") throw new Error("Source or coverage changed");
            for (const [model, expected] of Object.entries({longitude_only:35,spherical_separation:26,mean_distance_triangle:1})) {
              if (r.models[model].two_decimal_disagreements !== expected) throw new Error(model + " changed: " + r.models[model].two_decimal_disagreements);
            }
            if (!r.source_reconciliation || r.source_reconciliation.status !== "printed-source-consistent" ||
                r.source_reconciliation.comparedDays !== 365 || r.source_reconciliation.absentCalendarCells !== 7 ||
                r.source_reconciliation.mismatches.length !== 0 || r.source_reconciliation.sourceCsvPinned !== true) {
              throw new Error("Independent original USNO rendered source did not reconcile");
            }
            console.log("USNO external source reconciliation: 365/365 exact printed values, 7 calendar holes, capture SHA-256 " + r.source_reconciliation.sourceCaptureSha256);
            if (!(r.models.mean_distance_triangle.rmse < r.models.longitude_only.rmse)) throw new Error("Measured improvement was not reproduced");
            console.log("Reproduced 365-day pinned reference; mismatches 35/26/1");
          '
      - name: Test algebraic rounding bounds and qualify 365-day ranking
        run: |
          node --check src/lunar-rounding-sensitivity.mjs
          node --test test/lunar-rounding-sensitivity.test.mjs
          node src/lunar-rounding-sensitivity.mjs test/fixtures/usno-2026-noon-utc-illumination.csv > lunar-rounding-sensitivity.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("lunar-rounding-sensitivity.json", "utf8"));
            const expected = "b8e64f318ad14db40d5d95cf8260d78d3e52f78e4ba3e8cb5efde6991e0d2eff";
            if (r.reference.sha256 !== expected) throw new Error("Source mismatch");
            for (const [name, c] of Object.entries(r.comparisons)) {
              if (c.n !== 365 || c.witnesses.length !== 365 ||
                  c.lower > c.printedMseDifference || c.upper < c.printedMseDifference) {
                throw new Error("Rounding bounds invalid for " + name);
              }
              console.log(name, JSON.stringify({
                status:c.status, lower:c.lower, upper:c.upper,
                printedMseDifference:c.printedMseDifference
              }));
            }
          '
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-rounding-sensitivity
          path: lunar-rounding-sensitivity.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: lunar-reference-reproduction
          path: lunar-reference-reproduction.json
          retention-days: 30
